# riscv-formal configuration for Sixfold (read by tools/formal.sh; formal/README.md explains every line)
#
# Depths. One number N: the instruction retiring at cycle N is checked (reset is held for cycle 0 only).
# Two numbers R N (consistency checks): reset is held for R cycles, then the property is checked at cycle N.
# Three numbers R T N (unique): reset for R cycles, the tracked instruction retires by cycle T, checked to N.
# The first instruction can retire at cycle 6 (six stages). pc_fwd stops at 16 because solver time grows fast
# with depth on the performance build (measured with Bitwuzla: 12 cycles 60 s, 14 cycles 341 s, 16 cycles 9,022 s;
# 20 cycles gave no answer in 13 hours).

[options]
isa rv64im
nret 1
solver bitwuzla

[depth]
insn            20
reg        1    20
pc_fwd     1    16
pc_bwd     1    20
unique     1 10 20
causal     1    20

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS

[verilog-files]
@WRAPPER@
@CORE@
