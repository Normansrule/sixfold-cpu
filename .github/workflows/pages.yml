# The website on GitHub Pages: https://<user>.github.io/sixfold-cpu/
# Enable once: Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# (or: gh api -X POST repos/<user>/sixfold-cpu/pages -f build_type=workflow)
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site (the repository minus build output and the desktop app)
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./build --exclude=./node_modules --exclude=./desktop --exclude=./_site -cf - . | tar -xf - -C _site
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
