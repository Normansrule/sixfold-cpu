name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the tools (Verilog simulators, Yosys, RISC-V GCC for riscv-tests, Python packages, Chromium for the accessibility check)
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog verilator yosys gcc-riscv64-unknown-elf
          pip install pyserial unicorn capstone
          mkdir -p build/a11y && cd build/a11y && npm init -y > /dev/null && npm install --no-audit --no-fund playwright@1.49.1 axe-core@4.10.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null
      # One target runs the whole verify list in order (lint, Icarus, regression, SRAM caches, cycle equation,
      # riscv-tests, FPGA, generated docs, custom instructions, three instruction sets, accessibility, links).
      # The last log line names the check that failed.
      - name: Every check (make all-checks)
        run: make all-checks
