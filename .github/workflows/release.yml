# Desktop apps for Windows, macOS and Linux, attached to a GitHub Release.
#   git tag v2.1.0 && git push origin v2.1.0      (or run it by hand: Actions -> release -> Run workflow)
# The apps are not code-signed: see desktop/README.md for how to open them the first time.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Electron and electron-builder
        run: npm ci
      - name: Copy the site into the app
        run: npm run stage
      - name: 'Smoke test (Linux): every main page loads with no errors'
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          SIXFOLD_SMOKE=1 SIXFOLD_SMOKE_OUT=smoke.json xvfb-run -a npx electron . --no-sandbox || (cat smoke.json; exit 1)
          cat smoke.json
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sixfold-${{ runner.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Sixfold ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Desktop apps of Sixfold: the pipeline lab, the three-architecture lab, the instruction workshop and
            the documentation, offline. Windows: the setup or the portable .exe. macOS: the .dmg (Apple Silicon:
            arm64, Intel: x64). Linux: the .AppImage (chmod +x, then run) or the .deb. The apps are not
            code-signed; desktop/README.md says how to open them the first time.
          files: artifacts/*
