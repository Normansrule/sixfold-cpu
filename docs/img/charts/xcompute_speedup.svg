<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 344" width="910" height="344" role="img" aria-labelledby="t d"><title id="t">Packed instructions: speedup per kernel</title><desc id="d">Plain RV64 code cycles divided by packed code cycles, performance edition, for 6 kernels; the same numbers are in docs/img/charts/xcompute_table.md.</desc><rect width="100%" height="100%" rx="10" fill="#FBFCF8" stroke="#D5DBD0"/><text x="16" y="28" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#17251D">What the packed instructions buy: speedup per kernel</text><text x="16" y="48" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4A5A50">Plain RV64 + Zbb + M cycles ÷ packed (xcompute) cycles, performance edition, predictor on. Measured on the cycle-exact model; the RTL agrees.</text><line x1="330" x2="330" y1="70" y2="280" stroke="#E3E8DF"/><text x="330" y="298" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#6B7A70" text-anchor="middle">0x</text><line x1="447.5" x2="447.5" y1="70" y2="280" stroke="#E3E8DF"/><text x="447.5" y="298" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#6B7A70" text-anchor="middle">5x</text><line x1="565" x2="565" y1="70" y2="280" stroke="#E3E8DF"/><text x="565" y="298" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#6B7A70" text-anchor="middle">10x</text><line x1="682.5" x2="682.5" y1="70" y2="280" stroke="#E3E8DF"/><text x="682.5" y="298" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#6B7A70" text-anchor="middle">15x</text><line x1="800" x2="800" y1="70" y2="280" stroke="#E3E8DF"/><text x="800" y="298" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#6B7A70" text-anchor="middle">20x</text><g><title>brighten 2048 bytes (saturating add): 25,616 cycles plain, 2,363 packed (10.8x)</title><rect x="16" y="76" width="878" height="34" fill="transparent"/><text x="320" y="97" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#17251D" text-anchor="end">brighten 2048 bytes</text><path d="M330 84 H580.7507405840034 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H330 Z" fill="#2E86C1"/><text x="592.7507405840034" y="97" font-family="'IBM Plex Mono',Consolas,monospace" font-size="11.5" fill="#17251D">10.8x</text></g><g><title>blend 2048 bytes (rounded average): 24,635 cycles plain, 2,363 packed (10.4x)</title><rect x="16" y="110" width="878" height="34" fill="transparent"/><text x="320" y="131" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#17251D" text-anchor="end">blend 2048 bytes</text><path d="M330 118 H570.9947101142616 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H330 Z" fill="#2E86C1"/><text x="582.9947101142616" y="131" font-family="'IBM Plex Mono',Consolas,monospace" font-size="11.5" fill="#17251D">10.4x</text></g><g><title>motion search, 24 candidates x 256 pixels (SAD): 77,113 cycles plain, 5,121 packed (15.1x)</title><rect x="16" y="144" width="878" height="34" fill="transparent"/><text x="320" y="165" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#17251D" text-anchor="end">motion search, 24 candidates x 256 pixels</text><path d="M330 152 H679.8675063464167 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H330 Z" fill="#2E86C1"/><text x="691.8675063464167" y="165" font-family="'IBM Plex Mono',Consolas,monospace" font-size="11.5" fill="#17251D">15.1x</text></g><g><title>int8 layer, 8 neurons x 512 inputs (dot products): 66,539 cycles plain, 3,397 packed (19.6x)</title><rect x="16" y="178" width="878" height="34" fill="transparent"/><text x="320" y="199" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#17251D" text-anchor="end">int8 layer, 8 neurons x 512 inputs</text><path d="M330 186 H786.3080659405358 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H330 Z" fill="#2E86C1"/><text x="798.3080659405358" y="199" font-family="'IBM Plex Mono',Consolas,monospace" font-size="11.5" fill="#17251D">19.6x</text></g><g><title>transform 256 vertices by a 4 x 4 Q15 matrix: 49,052 cycles plain, 4,652 packed (10.5x)</title><rect x="16" y="212" width="878" height="34" fill="transparent"/><text x="320" y="233" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#17251D" text-anchor="end">transform 256 vertices by a 4 x 4 Q15 matrix</text><path d="M330 220 H573.7906276870164 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H330 Z" fill="#2E86C1"/><text x="585.7906276870164" y="233" font-family="'IBM Plex Mono',Consolas,monospace" font-size="11.5" fill="#17251D">10.5x</text></g><g><title>audio gain on 2048 Q15 samples: 35,559 cycles plain, 2,634 packed (13.5x)</title><rect x="16" y="246" width="878" height="34" fill="transparent"/><text x="320" y="267" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#17251D" text-anchor="end">audio gain on 2048 Q15 samples</text><path d="M330 254 H643.25 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H330 Z" fill="#2E86C1"/><text x="655.25" y="267" font-family="'IBM Plex Mono',Consolas,monospace" font-size="11.5" fill="#17251D">13.5x</text></g><line x1="330" x2="330" y1="70" y2="280" stroke="#6B7A70"/><text x="16" y="328" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#4A5A50">Geometric mean 13.0x. The plain loops handle one element per trip and are not unrolled; a compiler that unrolls them would narrow the gap.</text></svg>
