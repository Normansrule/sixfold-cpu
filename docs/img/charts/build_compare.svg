<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 808" width="1040" height="808" role="img" aria-labelledby="t d"><title id="t">Deep edition against turbo build: time per program</title><desc id="d">For each example program, the deep edition's run time divided by the turbo build's, at 7 nm. Below 1 the deep edition is faster.</desc><rect width="100%" height="100%" rx="10" fill="#FBFCF8" stroke="#D5DBD0"/><text x="16" y="28" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#17251D">Which build finishes first? Deep edition (14 stages) against turbo (6 stages), by kind of work</text><text x="16" y="48" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4A5A50">Run time = cycles (measured on the cycle-exact models) x clock period (measured at 7 nm: deep 466 ps, turbo 535 ps, no wires or clock skew).</text><text x="16" y="66" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4A5A50">Each bar is deep time / turbo time on a log scale. Left of the 1.0 line the deep edition is faster; right of it the turbo build is.</text><line x1="388.3702540226743" y1="84" x2="388.3702540226743" y2="762" stroke="#D5DBD0" stroke-width="1"/><text x="388.3702540226743" y="80" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#6B7A70" text-anchor="middle">0.80</text><line x1="485.9124537835722" y1="84" x2="485.9124537835722" y2="762" stroke="#17251D" stroke-width="1.5"/><text x="485.9124537835722" y="80" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#6B7A70" text-anchor="middle">1.00</text><line x1="583.45465354447" y1="84" x2="583.45465354447" y2="762" stroke="#D5DBD0" stroke-width="1"/><text x="583.45465354447" y="80" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#6B7A70" text-anchor="middle">1.25</text><line x1="663.1524337795439" y1="84" x2="663.1524337795439" y2="762" stroke="#D5DBD0" stroke-width="1"/><text x="663.1524337795439" y="80" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#6B7A70" text-anchor="middle">1.50</text><line x1="788.9062008655919" y1="84" x2="788.9062008655919" y2="762" stroke="#D5DBD0" stroke-width="1"/><text x="788.9062008655919" y="80" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#6B7A70" text-anchor="middle">2.00</text><text x="16" y="110" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#17251D">Tight, predictable loops<tspan font-weight="400" fill="#4A5A50">: DSP filters, fixed-trip counters, streaming arithmetic</tspan></text><text x="862" y="110" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#17251D">group 1.05x</text><g><title>05_fibonacci: deep 369 cycles (172.0 ns), turbo 330 cycles (176.6 ns), ratio 0.97</title><text x="320" y="132" font-family="'IBM Plex Mono',Consolas,monospace" font-size="11" fill="#17251D" text-anchor="end">05_fibonacci</text><rect x="474.38228585266495" y="122" width="11.530167930907226" height="12" rx="3" fill="#1F77B4"/><text x="862" y="132" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#4A5A50">0.97  172 / 177 ns</text></g><g><title>11_gshare_patterns: deep 1402 cycles (653.3 ns), turbo 1143 cycles (611.5 ns), ratio 1.07</title><text x="320" y="152" font-family="'IBM Plex Mono',Consolas,monospace" font-size="11" fill="#17251D" text-anchor="end">11_gshare_patterns</text><rect x="485.9124537835722" y="142" width="28.921361922476137" height="12" rx="3" fill="#C2410C"/><text x="862" y="152" font-family="'IBM Plex Mono',Consolas,monospace" font-size="10.5" fill="#4A5A50">1.07  653 / 612 ns</text></g><g><title>12_measure_cpi: deep 163 cycles (76.0 ns), turbo 129 cycles (69.0 ns), ratio 1.10</title><text x="320" y="172" font-family="'IBM Plex Mono',Consolas,monospace" font-size="11" fill