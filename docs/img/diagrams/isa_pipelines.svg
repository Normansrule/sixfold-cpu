<text x="297" y="370" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#00796B" text-anchor="start">branches and jumps resolve here: the next instruction (the delay slot) runs anyway, 0 bubbles</text>
<path d="M289,344 L289,396" fill="none" stroke="#C2185B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-flush)"/>
<text x="297" y="400" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#C2185B" text-anchor="start">but a branch needing a value still in EX waits 1 cycle</text>
<text x="40" y="436" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4A5A50" text-anchor="start">No prediction at all: the instruction set itself hides the branch.</text>
<text x="40" y="478" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start">x86-64, in-order with micro-ops</text>
