<path d="M459,534 L459,586" fill="none" stroke="#00796B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-pred)"/>
<text x="467" y="590" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#00796B" text-anchor="start">decoded into 1 to 3 micro-ops; jumps known here: redirect, 2 bubbles</text>
<text x="40" y="626" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4A5A50" text-anchor="start">PREDECODE finds where each instruction ends. cmp and jcc are two instructions.</text>
<text x="40" y="690" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#17251D" text-anchor="start">All seven comparison programs together (programs/compare/), measured on these models:</text>
