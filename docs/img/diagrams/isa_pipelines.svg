<path d="M878,132 L889,132" fill="none" stroke="#2B3A31" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-data)"/>
<path d="M629,154 L629,176" fill="none" stroke="#C2185B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-flush)"/>
<text x="637" y="180" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#C2185B" text-anchor="start">a wrong guess, or any jalr: flush, 3 bubbles</text>
<path d="M289,154 L289,206" fill="none" stroke="#00796B" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-pred)"/>
<text x="297" y="210" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#00796B" text-anchor="start">jumps and branches guessed taken: redirect, 1 bubble</text>
<text x="40" y="246" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4A5A50" text-anchor="start">Branches are predicted (gshare). Compare and branch are one instruction.</text>
<text x="40" y="288" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#6A5ACD" text-anchor="start">MIPS, the classic five stages</text>
