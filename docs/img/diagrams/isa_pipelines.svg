<text x="40" y="878" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">x86-64 has the smallest code and the most cycles here: dense instructions, but a simple in-order core spends extra stages finding and splitting them. Real x86 cores add wide decoders, micro-op caches and fusion to win that back.</text>
