rt-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="m-miss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="m-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A50"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#FBFCF8" stroke="#D5DBD0"/>
<text x="24" y="34" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#17251D" text-anchor="start">Three pipelines: where each one learns about a branch</text>
<text x="24" y="56" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4A5A50" text-anchor="start">The models in model/core.js (Sixfold, RISC-V) and model/isas/ (MIPS, x86-64): same memory, same multiply/divide timing, same predictor where one is used.</text>
<text x="40" y="98" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2E86C1" text-anchor="start">RISC-V on Sixfold</text>
<rect x="40" y="110" width="158" height="44" rx="6" fill="#2E86C1" stroke="#2E86C1" stroke-width="1.5" fill-opacity="0.12"/>
<text x="119" y="137" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2E86C1" text-anchor="middle">FETCH1</text>
<rect x="210" y="110" width="158" height="44" rx="6" fill="#2E86C1" stroke="#2E86C1" stroke-width="1.5" fill-opacity="0.12"/>
<text x="289" y="137" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2E86C1" text-anchor="middle">FETCH2</text>
