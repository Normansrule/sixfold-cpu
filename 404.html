<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixfold: page not found</title>
<meta name="robots" content="noindex">
<style>
  :root { --sub: #101B22; --panel: #15242D; --ink: #E9EFF1; --ink2: #9DB0B9; --F2: #6CC4BA; --E: #E8A33C; color-scheme: dark; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--sub); color: var(--ink); font: 17px/1.6 'Archivo', 'Helvetica Neue', Arial, sans-serif; padding: 16px; }
  main { max-width: 34rem; }
  .bars { display: flex; gap: 6px; margin-bottom: 28px; }
  .bars i { width: 14px; height: 56px; border-radius: 3px; background: var(--c); }
  .bars i:nth-child(4) { background: transparent; outline: 2px dashed var(--E); outline-offset: -2px; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; margin: 0 0 12px; letter-spacing: -.02em; }
  p { color: var(--ink2); margin: 0 0 22px; }
  nav { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; }
  a { color: var(--F2); text-underline-offset: .18em; }
  a.home { background: var(--F2); color: var(--sub); padding: .45em .95em; border-radius: 6px; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="bars" aria-hidden="true"><i style="--c:#5B9BD5"></i><i style="--c:#6CC4BA"></i><i style="--c:#A884D6"></i><i></i><i style="--c:#6DBE6D"></i><i style="--c:#E0584F"></i></div>
  <h1>A bubble in the pipeline.</h1>
  <p>Nothing lives at this address: the page was moved or the link has a typo. Like a flushed instruction, it never reached EXECUTE.</p>
  <nav>
    <a class="home" data-base href="./">Sixfold home</a>
    <a data-base href="web/index.html">Pipeline lab</a>
    <a data-base href="web/isa.html">Three architectures</a>
    <a data-base href="web/custom.html">Instruction workshop</a>
  </nav>
</main>
<script>
  // GitHub Pages serves this page at any missing path: point the links at the site's root (/<repo>/ on github.io)
  const seg = location.hostname.endsWith('github.io') ? location.pathname.split('/').filter(Boolean)[0] : '';
  const base = seg ? `/${seg}/` : '/';
  document.querySelectorAll('[data-base]').forEach(a => { a.href = base + a.getAttribute('href').replace(/^\.\//, ''); });
</script>
</body>
</html>
